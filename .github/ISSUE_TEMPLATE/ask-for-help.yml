name: Ask for help
description: Stuck on a project? Ask here. No question is too basic.
title: "Help: "
labels: ["type: help"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome here, and the answers will be kind. 🦦
        **Before you post:** remove passwords, keys, tokens and your home's public IP from anything you paste.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
      description: Paste the error message (with secrets removed) or a screenshot.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Device, operating system, tools, versions. Say "I'm not sure" if you don't know. That's okay.
  - type: checkboxes
    id: safe
    attributes:
      label: Safe to share
      options:
        - label: I removed passwords, keys, tokens and private info from this post.
          required: true
